version: '3.8'

services:

  vla_service:
    build: ./vla
    container_name: vla_service
    ports:
      - "8001:8001"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    networks:
      - vla_net
    restart: unless-stopped

  perception_service:
    build: ./perception
    container_name: perception_service
    ports:
      - "8002:8002"
    environment:
      - COPPELIA_HOST=host.docker.internal   # connects to CoppeliaSim on Windows
      - COPPELIA_PORT=23000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - vla_net
    restart: unless-stopped

  controller_service:
    build: ./controller
    container_name: controller_service
    ports:
      - "8003:8003"
    environment:
      - COPPELIA_HOST=host.docker.internal
      - COPPELIA_PORT=23000
      - VLA_URL=http://vla_service:8001
      - PERCEPTION_URL=http://perception_service:8002
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - vla_net
    depends_on:
      - vla_service
      - perception_service
    restart: unless-stopped

networks:
  vla_net:
    driver: bridge

volumes:
  huggingface_cache: